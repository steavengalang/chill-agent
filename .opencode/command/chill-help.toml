description = "Quick reference for chill levels, skills, and commands"
prompt = "Show the chill quick reference. One shot, change nothing: do not switch mode, write flag files, or persist anything. Levels: /chill lite (build what's asked, name the lazier alternative in one line), /chill (full, the default ladder: YAGNI then stdlib then native then one line then minimum), /chill ultra (deletion before addition, challenges the requirement before building). Commands: /chill-review (over-engineering review of the current changes), /chill-audit (whole-repo over-engineering audit), /chill-debt (harvest shortcut: comments into a tracked ledger), /chill-gain (measured-impact scoreboard from the benchmark), /chill-help (this card). Deactivate with 'stop chill', 'normal mode', or /chill off; resume anytime with /chill. Default mode is full; change it with the PONYTAIL_DEFAULT_MODE environment variable (off|lite|full|ultra) or a config file at ~/.config/chill/config.json (Windows: %APPDATA%\\chill\\config.json) with {\"defaultMode\": \"lite\"}. Resolution order: env var, then config file, then full."
